[versions]
kotlin = "2.4.0"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
collectionsImmutable = "0.4.0"
androidKmp = "9.2.1"
vanniktech = "0.36.0"
detekt = "1.23.8"
ktlint = "14.2.0"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
vanniktech = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }

anstyle-kotlin = { module = "io.github.kotlinmania:anstyle-kotlin", version = "0.1.5" }
bitflags-kotlin = { module = "io.github.kotlinmania:bitflags-kotlin", version = "0.1.1" }
itertools-kotlin = { module = "io.github.kotlinmania:itertools-kotlin", version = "0.1.1" }
kasuari-kotlin = { module = "io.github.kotlinmania:kasuari-kotlin", version = "0.1.6" }
serde-kotlin = { module = "io.github.kotlinmania:serde-kotlin", version = "0.1.1" }
strum-kotlin = { module = "io.github.kotlinmania:strum-kotlin", version = "0.1.1" }
unicode-segmentation-kotlin = { module = "io.github.kotlinmania:unicode-segmentation-kotlin", version = "0.1.1" }
unicode-width-kotlin = { module = "io.github.kotlinmania:unicode-width-kotlin", version = "0.1.1" }
crossterm-kotlin = { module = "io.github.kotlinmania:crossterm-kotlin", version = "0.1.4" }
[bundles]
ratatui-commonMain = [
    "kotlinx-coroutines-core",
    "kotlinx-serialization-core",
    "kotlinx-serialization-json",
    "kotlinx-datetime",
    "collections-immutable",
    "anstyle-kotlin",
    "bitflags-kotlin",
    "itertools-kotlin",
    "kasuari-kotlin",
    "serde-kotlin",
    "strum-kotlin",
    "unicode-segmentation-kotlin",
    "unicode-width-kotlin",
    "crossterm-kotlin",
]
